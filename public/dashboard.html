<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Sistema Recepci&oacute;n</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .container { margin-top: 20px; display: grid; gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button.btn-primary { background: #6366f1; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #334155; text-align: left; }
        th { background: #0f172a; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>Bienvenido, <span id="user-name">...</span></h2>
            <small>Rol: <strong id="user-role">...</strong></small>
        </div>
        <button id="logout-btn" class="btn-logout">Cerrar Sesi&oacute;n</button>
    </div>

    <div class="container">
        <!-- SECCIÓN EXCLUSIVA PARA ADMINISTRADORES -->
        <div id="admin-section" class="card hidden">
            <h3>Gest&oacute;n de Usuarios y Roles</h3>
            
            <form id="create-user-form">
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" id="new-username" required>
                </div>
                <div class="form-group">
                    <label>Correo Electr&oacute;nico</label>
                    <input type="email" id="new-email" required>
                </div>
                <div class="form-group">
                    <label>Contrase&ntilde;a</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label>Rol asignado</label>
                    <select id="new-role">
                        <option value="recepcion">Recepci&oacute;n</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Crear Usuario</button>
            </form>

            <h4 style="margin-top: 25px;">Usuarios Registrados</h4>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>

        <!-- SECCIÓN GENERAL -->
        <div class="card">
            <h3>Control de Recepci&oacute;n</h3>
            <p>Aqu&iacute; va el panel de control general del acceso a las instalaciones.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
