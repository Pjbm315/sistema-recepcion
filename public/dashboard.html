<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Control de Acceso</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .container { margin-top: 20px; display: grid; gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button.btn-primary { background: #6366f1; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button.btn-primary:hover { background: #4f46e5; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #334155; text-align: left; }
        th { background: #0f172a; color: #818cf8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin: 0;">Bienvenido, <span id="user-name">...</span></h2>
            <small>Rol actual: <strong id="user-role" style="color: #818cf8;">...</strong></small>
        </div>
        <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
    </div>

    <div class="container">
        
        <!-- SECCIÓN RECEPCIÓN / GENERAL: REGISTRO DE VISITANTES -->
        <div class="card">
            <h3>Registrar Nuevo Visitante</h3>
            <form id="visitor-form">
                <div class="form-group">
                    <label>Nombre y Apellido del Visitante</label>
                    <input type="text" id="vis-nombre" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Cédula / Documento de Identidad</label>
                    <input type="text" id="vis-cedula" placeholder="Ej: V-12345678" required>
                </div>
                <div class="form-group">
                    <label>Asunto o Persona a Visitar</label>
                    <input type="text" id="vis-asunto" placeholder="Ej: Entrevista / Reunión con Recursos Humanos" required>
                </div>
                <button type="submit" class="btn-primary">Registrar Entradas</button>
            </form>
        </div>

        <!-- SECCIÓN: HISTORIAL DE VISITAS -->
        <div class="card">
            <h3>Historial de Entradas y Visitas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha/Hora</th>
                        <th>Visitante</th>
                        <th>Cédula</th>
                        <th>Asunto</th>
                        <th>Registrado por</th>
                    </tr>
                </thead>
                <tbody id="visits-table-body"></tbody>
            </table>
        </div>

        <!-- SECCIÓN EXCLUSIVA PARA ADMINISTRADORES -->
        <div id="admin-section" class="card hidden">
            <h3>Panel de Administración: Gestión de Usuarios</h3>
            
            <form id="create-user-form">
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" id="new-username" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="new-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label>Rol Asignado</label>
                    <select id="new-role">
                        <option value="recepcion">Recepción</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="background: #10b981;">Crear Usuario</button>
            </form>

            <h4 style="margin-top: 25px;">Lista de Usuarios del Sistema</h4>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
